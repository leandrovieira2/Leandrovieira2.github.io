<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex - Leandro</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }

      main {
        background-color: dodgerblue;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .emoji {
        font-size: 4rem;
      }

      .nome {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="emoji">😀</span>
      <span class="nome">Leandro</span>
    </main>
  </body>
</html>
