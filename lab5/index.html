<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 5 - Cairo</title>
    <style>
      body {
        background-color: #fdf3e0;
        font-family: Arial, sans-serif;
      }

      header {
        background-color: #e76f51;
        color: white;
        text-align: center;
        padding: 20px;
      }

      main {
        padding: 20px;
      }

      section {
        background-color: white;
        padding: 15px;
        margin-bottom: 20px;
      }

      footer {
        text-align: center;
        padding: 15px;
      }

      #caixa-bolas {
        display: flex;
        gap: 10px;
        height: 200px;
        box-sizing: border-box;
        padding: 10px;
        margin-top: 10px;
        background-color: lightgray;
      }

      .bola {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: #e76f51;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Eventos no Cairo</h1>
    </header>

    <main>
      <section>
        <h2 id="frase" onmouseover="mudarFrase()" onmouseout="restaurarFrase()">
          Passa o rato por cima de mim
        </h2>
      </section>

      <section>
        <p id="frase-pintar">As pirâmides esperam por ti!</p>
        <button type="button" class="color" data-color="orange">Laranja</button>
        <button type="button" class="color" data-color="dodgerblue">
          Azul
        </button>
        <button type="button" class="color" data-color="goldenrod">
          Dourado
        </button>
      </section>

      <section>
        <p>Camelos contados: <span id="contador">0</span></p>
        <button type="button" id="btn-incrementar">Incrementar</button>
        <button type="button" id="btn-decrementar">Decrementar</button>
        <button type="button" id="btn-reset">Reset</button>
      </section>

      <section>
        <p>Temporizador: <span id="segundos">0</span> segundos</p>
      </section>

      <section>
        <label for="cor">Escolhe uma cor de fundo:</label>
        <select id="cor">
          <option value="#fdf3e0">Original</option>
          <option value="white">Branco</option>
          <option value="orange">Laranja</option>
          <option value="lightblue">Azul claro</option>
          <option value="tan">Areia</option>
        </select>
      </section>

      <section>
        <label for="mensagem">Escreve uma mensagem:</label>
        <textarea id="mensagem" oninput="mudarCorMensagem()"></textarea>
      </section>

      <section>
        <label for="direcao">Direção das bolas:</label>
        <select id="direcao">
          <option value="row">row</option>
          <option value="row-reverse">row-reverse</option>
          <option value="column">column</option>
          <option value="column-reverse">column-reverse</option>
        </select>

        <div id="caixa-bolas">
          <div class="bola"></div>
          <div class="bola"></div>
          <div class="bola"></div>
          <div class="bola"></div>
        </div>
      </section>

      <section>
        <form>
          <label for="nome">Nome:</label>
          <input id="nome" type="text" placeholder="insira o seu nome" />

          <label for="idade">Idade:</label>
          <input id="idade" type="number" placeholder="insira a sua idade" />

          <button type="submit">Submit</button>
        </form>
        <p id="resposta"></p>
      </section>
    </main>

    <footer>
      <p>DIW 2026 - Lab 5</p>
    </footer>

    <script>
      let vez = 0;

      // Evento 1: o rato passa por cima da frase
      function mudarFrase() {
        document.getElementById("frase").textContent = "Bem-vindo ao Cairo!";
      }

      function restaurarFrase() {
        document.getElementById("frase").textContent =
          "Passa o rato por cima de mim";
      }

      // Evento 2: cada botão pinta a frase com a cor guardada em data-color
      const frasePintar = document.getElementById("frase-pintar");

      document.querySelectorAll("button.color").forEach((botao) => {
        botao.addEventListener("click", () => {
          frasePintar.style.color = botao.dataset.color;
        });
      });

      // Evento 3: contador com Local Storage

      // 1. Variáveis
      const contadorEl = document.getElementById("contador");
      const btnIncrementar = document.getElementById("btn-incrementar");
      const btnDecrementar = document.getElementById("btn-decrementar");
      const btnReset = document.getElementById("btn-reset");

      // O Local Storage guarda texto. Number() converte para número, e se a
      // chave ainda não existir, getItem devolve null e Number(null) dá 0.
      let contador = Number(localStorage.getItem("contador"));

      // 2. Event handlers
      const atualizarContador = () => {
        contadorEl.textContent = contador;
        localStorage.setItem("contador", contador);
      };

      const incrementar = () => {
        contador = contador + 1;
        atualizarContador();
      };

      const decrementar = () => {
        contador = contador - 1;
        atualizarContador();
      };

      const reset = () => {
        contador = 0;
        atualizarContador();
      };

      // 3. Event listeners
      btnIncrementar.addEventListener("click", incrementar);
      btnDecrementar.addEventListener("click", decrementar);
      btnReset.addEventListener("click", reset);

      // Ao carregar a página, mostra o valor que estava guardado
      contadorEl.textContent = contador;

      // Temporizador com setInterval

      // 1. Variáveis
      const segundosEl = document.getElementById("segundos");
      let segundos = 0;

      // 2. Função chamada a cada segundo
      const contarSegundos = () => {
        segundos = segundos + 1;
        segundosEl.textContent = segundos;
      };

      // 3. Arranca o temporizador: chama a função de 1000 em 1000 milissegundos
      setInterval(contarSegundos, 1000);

      // Evento 4: o select muda a cor do fundo (função normal, para usar this)
      document.querySelector("#cor").addEventListener("change", function () {
        document.body.style.backgroundColor = this.value;
      });

      // Evento 5: a cada tecla, o fundo da caixa muda de cor (4 cores)
      function mudarCorMensagem() {
        let caixa = document.getElementById("mensagem");
        vez = vez + 1;

        if (vez === 1) {
          caixa.style.backgroundColor = "orange";
        } else if (vez === 2) {
          caixa.style.backgroundColor = "lightblue";
        } else if (vez === 3) {
          caixa.style.backgroundColor = "yellow";
        } else {
          caixa.style.backgroundColor = "tan";
          vez = 0;
        }
      }

      // Select flex: muda a flex-direction do contentor das bolas
      const caixaBolas = document.getElementById("caixa-bolas");

      document
        .querySelector("#direcao")
        .addEventListener("change", function () {
          caixaBolas.style.flexDirection = this.value;
        });

      // Formulário: mostra "Olá, o XXX tem YYY!" sem recarregar a página
      const nomeInput = document.getElementById("nome");
      const idadeInput = document.getElementById("idade");
      const resposta = document.getElementById("resposta");

      document.querySelector("form").onsubmit = (e) => {
        e.preventDefault(); // para não recarregar a página
        resposta.textContent = `Olá, o ${nomeInput.value} tem ${idadeInput.value}!`;
      };
    </script>
  </body>
</html>
