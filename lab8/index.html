<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja DEISI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img class="logo" src="images/deisi-inverse.svg" alt="DEISI" />
      <h1>Loja DEISI</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Selecione os seus Produtos</h2>

        <div class="controlos">
          <label for="filtro">Filtrar</label>
          <select id="filtro">
            <option value="">Todas as categorias</option>
          </select>

          <label for="ordenar">Ordenar</label>
          <select id="ordenar">
            <option value="">Ordenar pelo preço</option>
            <option value="decrescente">Preço Decrescente</option>
            <option value="crescente">Preço Crescente</option>
          </select>

          <label for="pesquisa">Procurar</label>
          <input type="text" id="pesquisa" placeholder="pesquise por produto" />
        </div>

        <div class="lista"></div>
      </section>

      <section id="cesto">
        <h2>Produtos Selecionados</h2>
        <div class="lista"></div>

        <div class="compra">
          <p class="total">Custo total: <span>0.00</span> €</p>

          <p>
            <label for="estudante">És estudante do DEISI?</label>
            <input type="checkbox" id="estudante" />
          </p>

          <p>
            <label for="cupao">Cupão de desconto:</label>
            <input type="text" id="cupao" />
          </p>

          <button type="button" id="comprar">Comprar</button>

          <p id="valor-final"></p>
          <p id="referencia"></p>
        </div>
      </section>
    </main>

    <footer>
      <p>DIW 2026 - Lab 8</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
